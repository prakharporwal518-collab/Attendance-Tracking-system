<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Tracking System</title>
  <meta name="description" content="Track and report student attendance for a college or school." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b5bdb'/><text y='70' x='50' text-anchor='middle' font-size='58' font-family='sans-serif' font-weight='bold' fill='white'>A</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- Sign in -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="brand-mark">
        <div class="logo">A</div>
        <div>
          <h1 style="font-size:1.2rem">Attendance Tracker</h1>
          <div class="small muted">Sign in to continue</div>
        </div>
      </div>

      <div id="login-error" class="alert error hidden"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn full" type="submit" id="login-submit">Sign in</button>
      </form>

      <div class="demo-hint">
        <strong>Demo accounts</strong> — password <code>password123</code><br />
        <button type="button" data-demo="admin@college.edu">admin@college.edu</button> ·
        <button type="button" data-demo="sunita.rao@college.edu">sunita.rao@college.edu</button> ·
        <button type="button" data-demo="aarav.sharma1@student.college.edu">aarav.sharma1@student.college.edu</button>
      </div>
    </div>
  </div>

  <!-- Application -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand-mark">
        <div class="logo">A</div>
        <span>Attendance</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">?</div>
          <div class="who">
            <strong id="user-name">—</strong>
            <span id="user-role" class="muted">—</span>
          </div>
        </div>
        <button class="nav-link" id="logout-btn"><span class="icon">⎋</span> Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
        <div>
          <h1 id="view-title">Dashboard</h1>
          <div class="subtitle" id="view-subtitle"></div>
        </div>
      </header>
      <main id="view" class="view">
        <div class="loading">Loading…</div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
