# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repository.
#
# This is configured for Render's FREE instance type so it deploys on any
# account. Free instances have no persistent disk: the filesystem is replaced
# whenever the service restarts or spins down after being idle, so the SQLite
# database is recreated empty each time. SEED_DEMO_DATA below refills it on
# every boot, which makes that harmless for a demo.
#
# To keep real data, see "Keeping your data" at the bottom of this file.

services:
  - type: web
    name: attendance-tracking-system
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      # The app needs Node 22.5+ for its built-in SQLite support.
      - key: NODE_VERSION
        value: 22.11.0

      # Generated once by Render and kept across deploys. Changing it signs
      # everyone out, which is the correct response to it ever leaking.
      - key: JWT_SECRET
        generateValue: true

      # Loads the sample students, courses and attendance history on each
      # boot, so the deployed demo is never an empty login screen.
      # Remove this once you are entering real data — the demo password is
      # published in the README.
      - key: SEED_DEMO_DATA
        value: "true"

      # Currency the expense tracker labels amounts with (ISO 4217).
      - key: CURRENCY
        value: INR

      # Your own administrator login. sync:false means Render asks you for
      # the values instead of reading them from this file, so they are never
      # committed to git. Optional: without them you can still sign in with
      # the demo accounts above.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# ── Keeping your data ────────────────────────────────────────────────────────
#
# Free instances cannot have disks, so nothing survives a restart. For data
# that persists, change `plan: free` to a paid instance type and add:
#
#     disk:
#       name: attendance-data
#       mountPath: /var/data
#       sizeGB: 1
#
# together with an environment variable pointing the database at that disk:
#
#     - key: DATABASE_FILE
#       value: /var/data/attendance.sqlite
#
# and remove SEED_DEMO_DATA so your real records are not mixed with samples.
